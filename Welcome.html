<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        /* 全局样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(145deg, #3445db ,#3445db); /* 深海蓝渐变 */
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        /* 公告跑马灯样式 */
        .announcement {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 0;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .wrap {
            position: relative;
            width: 100%;
        }
        .heart {
            display: block;
            overflow: hidden;
        }
        .scroller {
            display: block;
            width: 100%;
            white-space: nowrap;
            overflow: visible;
        }
       .announcement p {
        color: red;
        display: inline-block;
        font-family: 微軟正黑;
        font-size: 18px;
        font-weight: bold; /* 添加这行使字体加粗 */
        line-height: 1.5;
        width: auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-right: 40px;
        text-shadow: none; /* 确保没有阴影 */
        }
        .announcement span {
            background: url(logo.png);
            border-radius: 25px;
            display: inline-block;
            width: 24px;
            height: 24px;
            margin-right: .5em;
            max-width: 100%; 
            position: absolute;
            top: 3px;
            left: -30px;
        }

        /* 主容器 */
        #main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            max-width: 700px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            transition: transform 0.3s ease;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 20px;
        }

        /* 标题样式 */
        .welcome-header {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: -webkit-linear-gradient(45deg, #ff6b6b, #ffd66b, #4dd4b0, #42a5f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        /* 加载动画 */
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 欢迎信息样式 */
        .welcome-message {
            font-size: 1.5rem;
            line-height: 1.8;
            transition: transform 0.3s ease, opacity 0.3s ease;
            color: rgba(255, 255, 255, 0.9);
        }

        .welcome-message b {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            color:  #ff4444;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* IP 地址样式 */
        .ip-address {
            filter: blur(8px);
            transition: filter 0.3s ease, color 0.3s ease, transform 0.3s ease;
            cursor: pointer;
            color: rgba(255, 25, 0, 0.8);
        }

        .ip-address:hover {
            filter: blur(0);
            color: #ff1900;
            transform: scale(1.05);
        }

        /* 错误信息 */
        .error-message {
            font-family: 'Roboto', sans-serif;
            color: #ff4d4d;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* 按钮样式 */
        .refresh-button {
            margin-top: 20px;
            padding: 10px 25px;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(45deg, rgba(14, 207, 254, 0.8), rgba(7, 166, 241, 0.8));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .refresh-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* 媒体查询 */
        @media (max-width: 768px) {
            #main-container {
                padding: 20px;
                backdrop-filter: blur(5px);
            }
            .welcome-header {
                font-size: 2rem;
            }
            .welcome-message {
                font-size: 1rem;
            }
            .loading-spinner {
                width: 50px;
                height: 50px;
                border-width: 4px;
            }
            .announcement p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 公告跑马灯 -->
    <div class="announcement">
        <div class="wrap">
            <marquee scrollamount="8" scrolldelay="60" truespeed="true" loop="true" class="heart">
                <div class="scroller">
                    <p><span>&nbsp;</span>公告：</p>
                    <p><span>&nbsp;</span>这里是zdDown博客，这里汇总收集各类问题，日常增长知识等 </p>
                    <p><span>&nbsp;</span> CTRL+D 收藏本站永久地址</p>
                </div>
            </marquee>
        </div>
    </div>

    <!-- 主内容 -->
    <div id="main-container">
        <h1 class="welcome-header"> </h1>
        <div class="loading-spinner" id="loading-spinner"></div>
        <div class="welcome-message" id="welcome-message" style="display: none;">
            <p>欢迎来自 <b id="visitor-location"></b> 的朋友💖</p>
            <p>你当前距博主约 <b id="visitor-distance"></b> 公里🍃 </p>
            <p>你的 IP 地址：<b class="ip-address" id="visitor-ip"></b></p>
            <p id="greeting-message"></p>
        </div>
        <div class="error-message" id="error-message" style="display: none;">
            <p>抱歉，无法加载访客信息</p>
        </div>
    </div>

    <script>
        // 保持原有JavaScript逻辑不变
        const CONFIG = {
            API_KEY: 'ofZgS2vLqr46BnAv462Y0odyOZ',
            BLOG_LOCATION: { lng: 115.84634200000005, lat: 28.67402299999999},
        };

        const fetchIpData = async () => {
            try {
                const response = await fetch(`https://api.nsmao.net/api/ipip/query?key=${encodeURIComponent(CONFIG.API_KEY)}`);
                if (!response.ok) throw new Error('网络错误，无法获取IP信息');
                return await response.json();
            } catch (error) {
                console.error('Error fetching IP data:', error);
                throw error;
            }
        };

        const calculateDistance = (lng, lat) => {
            const R = 6371;
            const rad = Math.PI / 180;
            const dLat = (lat - CONFIG.BLOG_LOCATION.lat) * rad;
            const dLon = (lng - CONFIG.BLOG_LOCATION.lng) * rad;
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(CONFIG.BLOG_LOCATION.lat * rad) * Math.cos(lat * rad) *
                Math.sin(dLon / 2) ** 2;
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        };

        const formatLocation = (country, province, city) => {
            if (!country) return '未知地区';
            if (country === '中国') return `${province || ''} ${city || ''}`.trim();
            return country;
        };

        const formatIp = (ip) => ip.includes(':') ? 'IPv6 地址（隐藏）' : ip;

        const showWelcomeMessage = (location, distance, ip) => {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
            const welcomeMessage = document.getElementById('welcome-message');
            welcomeMessage.style.display = 'block';
            document.getElementById('visitor-location').textContent = location;
            document.getElementById('visitor-distance').textContent = distance;
            document.getElementById('visitor-ip').textContent = ip;
            document.getElementById('greeting-message').textContent = getGreeting();
        };

        const showErrorMessage = () => {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('welcome-message').style.display = 'none';
            document.getElementById('error-message').style.display = 'block';
        };

        const getGreeting = () => {
            const hour = new Date().getHours();
            if (hour < 5) return '夜深了！🌌 别忘了休息，睡个好觉，明天更美好';
            if (hour < 11) return '早上好！🌄 一日之计在于晨！';
            if (hour < 13) return '中午好！☀️ 午饭时间到，记得吃点好吃的！';
            if (hour < 18) return '下午好！🌤️ 希望今天的你状态满满，事事顺心！';
            if (hour < 23) return '晚上好！🌙  忙碌了一天，放松一下享受宁静时光吧！';
            return '夜深了！🌌 别忘了休息，睡个好觉，明天更美好';
        };

        const initialize = async () => {
            try {
                const data = await fetchIpData();
                const { lng, lat, country, province, city } = data.data || {};
                const ip = data.ip || '未知IP';
                const location = formatLocation(country, province, city);
                const distance = calculateDistance(lng, lat);
                const formattedIp = formatIp(ip);
                showWelcomeMessage(location, `${distance}`, formattedIp);
            } catch {
                showErrorMessage();
            }
        };

        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
